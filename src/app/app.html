<header>
  <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/">Club Náutico Poseidón</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarCollapse"
        aria-controls="navbarCollapse"
        aria-expanded="false"
        aria-label="Navegación"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
          </li>
          @if (authService.isAuthenticated()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
            </li>
          }
        </ul>
        <ul class="navbar-nav">
          @if (authService.isAuthenticated()) {
            <li class="nav-item d-flex align-items-center me-2">
              <span class="nav-link text-light py-0">
                <i class="bi bi-person-circle"></i>
              </span>
            </li>
            <li class="nav-item">
              <button class="btn btn-outline-light" type="button" (click)="logout()">
                Cerrar Sesión
              </button>
            </li>
          } @else {
            <li class="nav-item">
              <button class="btn btn-outline-light" type="button" routerLink="/login">
                Iniciar Sesión
              </button>
            </li>
          }
        </ul>
      </div>
    </div>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>

  <!-- FOOTER -->
  <footer class="container mt-5">
    <p class="float-end"><a href="#">Volver arriba</a></p>
    <p>
      &copy; 2026 Club Náutico Poseidón. &middot; <a href="#">Privacidad</a> &middot;
      <a href="#">Términos</a>
    </p>
  </footer>
</main>
