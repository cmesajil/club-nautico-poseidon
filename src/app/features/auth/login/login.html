<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh">
  <div class="card shadow-lg border-0" style="width: 100%; max-width: 400px; border-radius: 15px">
    <div class="card-body p-5">
      <h3 class="text-center mb-4 fw-bold text-dark">Bienvenido</h3>
      <p class="text-center text-muted mb-4">Ingresa tus credenciales para acceder al club</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label small text-uppercase fw-bold">Correo Electrónico</label>
          <input
            type="email"
            formControlName="email"
            class="form-control form-control-lg"
            placeholder="socio@nautico.com"
          />
        </div>

        <div class="mb-4">
          <label class="form-label small text-uppercase fw-bold">Contraseña</label>
          <input
            type="password"
            formControlName="password"
            class="form-control form-control-lg"
            placeholder="••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="btn btn-dark btn-lg w-100 shadow-sm"
          style="border-radius: 10px"
        >
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>
</div>
